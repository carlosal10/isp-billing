openapi: 3.0.3
info:
  title: ISP Billing API
  version: 1.0.0
servers:
  - url: https://your-host/api
paths:
  /health:
    get:
      summary: Public API liveness check
      responses:
        '200': { description: OK }
  /health/detail:
    get:
      summary: Health details
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /ready:
    get:
      summary: Public readiness check for database connectivity and graceful shutdown state
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /metrics:
    get:
      summary: Prometheus-style process-local HTTP metrics
      responses:
        '200': { description: Metrics text exposition }
        '404': { description: Hidden when metrics token is missing or invalid }
  /jobs/definitions:
    get:
      summary: List registered scheduler jobs with live state and latest run metadata
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /jobs/runs:
    get:
      summary: List persisted job execution history
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: OK }
  /jobs/actions:
    get:
      summary: List manual scheduler actions such as run, pause, and resume
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: OK }
  /audit-logs:
    get:
      summary: List tenant audit events with filters, pagination, and redacted payloads
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: actor
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 250 }
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /audit-logs/actions:
    get:
      summary: List tenant audit action names with counts for filters
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /audit-logs/summary:
    get:
      summary: Summarize matching tenant audit events by action and actor
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /team/members:
    get:
      summary: List tenant team members and their roles
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /team/members/{id}/role:
    patch:
      summary: Update a tenant team member role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Insufficient role }
        '404': { description: Team member not found }
        '409': { description: Last owner protection }
  /team/members/{id}:
    delete:
      summary: Remove a team member from the tenant
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Insufficient role }
        '404': { description: Team member not found }
        '409': { description: Last owner or self-removal protection }
  /invites:
    get:
      summary: List pending tenant invites
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
    post:
      summary: Create a tenant invite for owner, admin, or operator access
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '400': { description: Invalid payload }
        '403': { description: Insufficient role for requested invite role }
        '409': { description: User is already a member }
  /invites/accept:
    post:
      summary: Publicly accept a tenant invite and create a tenant session
      responses:
        '200': { description: OK }
        '400': { description: Invalid or expired invite }
  /invites/{id}:
    delete:
      summary: Revoke a pending tenant invite
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Insufficient role }
        '404': { description: Invite not found }
  /api-keys:
    get:
      summary: List tenant API keys without exposing secret material
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
    post:
      summary: Create a scoped tenant API key and return the plaintext key once
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '400': { description: Invalid scopes or expiry }
        '403': { description: Owner or admin role required }
  /api-keys/scopes:
    get:
      summary: List supported tenant API key scopes
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /api-keys/{id}:
    patch:
      summary: Update API key label, description, scopes, or expiry
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: API key not found }
        '409': { description: Revoked API key cannot be updated }
    delete:
      summary: Revoke a tenant API key
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: API key not found }
  /integration/v1/health:
    get:
      summary: Validate a tenant API key and return its tenant and scope context
      security:
        - apiKeyAuth: []
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid API key }
  /integration/v1/customers:
    get:
      summary: List tenant customers through a scoped integration API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
        '403': { description: customers:read scope required }
  /integration/v1/customers/{id}:
    get:
      summary: Get one tenant customer through a scoped integration API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: customers:read scope required }
        '404': { description: Customer not found }
  /integration/v1/invoices:
    get:
      summary: List tenant invoices through a scoped integration API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: customerId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
        '403': { description: invoices:read scope required }
  /integration/v1/invoices/{id}:
    get:
      summary: Get one tenant invoice through a scoped integration API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: invoices:read scope required }
        '404': { description: Invoice not found }
  /integration/v1/payments:
    get:
      summary: List tenant payments through a scoped integration API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
        '403': { description: payments:read scope required }
  /integration/v1/support/tickets:
    post:
      summary: Create a support ticket through a scoped integration API key
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string }
                customerId: { type: string }
                accountNumber: { type: string }
                category: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Invalid request }
        '403': { description: support:write scope required }
  /jobs/{name}/run:
    post:
      summary: Trigger a manually runnable job immediately
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                reason: { type: string }
      responses:
        '200': { description: OK }
  /jobs/{name}/pause:
    post:
      summary: Pause a scheduler job so cron-triggered runs stop firing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                note: { type: string }
      responses:
        '200': { description: OK }
  /jobs/{name}/resume:
    post:
      summary: Resume a paused scheduler job
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                note: { type: string }
      responses:
        '200': { description: OK }
  /mikrotik/servers:
    get:
      summary: List MikroTik servers
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
    post:
      summary: Create MikroTik server
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
  /mikrotik/servers/{id}/test:
    post:
      summary: Test connection
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /plans:
    get:
      summary: List tenant service plans
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
    post:
      summary: Create a tenant service plan
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '400': { description: Invalid plan payload }
  /plans/{id}:
    get:
      summary: Get a tenant service plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Plan not found }
    put:
      summary: Update a tenant service plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Invalid plan payload }
        '404': { description: Plan not found }
    delete:
      summary: Delete a tenant service plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Plan not found }
  /payments/manual:
    post:
      summary: Create/validate manual payment (supports backdating)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /payments/{id}:
    get:
      summary: Get a finance audit view for one payment including allocations, credits, and ledger entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /payments/{id}/refund:
    post:
      summary: Refund a settled payment and reverse its invoice allocations and ledger entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /payments/{id}/reverse:
    post:
      summary: Reverse a settled payment without marking it as refunded
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /payments/{id}/chargeback:
    post:
      summary: Record a chargeback against a settled payment and unwind finance state
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /invoices:
    get:
      summary: List tenant invoices with finance status and balances
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /invoices/{id}:
    get:
      summary: Get a finance audit view for one invoice including allocations, source credits, and ledger entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /invoices/issue:
    post:
      summary: Manually issue an invoice for a customer and plan
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
  /invoices/{id}/pay:
    put:
      summary: Settle an invoice via a manual validated payment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /invoices/{id}/generate:
    post:
      summary: Generate an invoice number and mark the invoice document as generated
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /invoices/{id}/pdf:
    get:
      summary: Render an invoice document as HTML for browser printing or PDF export
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /finance/summary:
    get:
      summary: Get finance summary totals including invoiced, outstanding, credits, and collections
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /finance/invoice-aging:
    get:
      summary: Get open invoice aging buckets and invoice-level aging rows
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /finance/credits:
    get:
      summary: List customer credit notes and remaining unapplied credit balances
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /finance/ledger:
    get:
      summary: List recent billing ledger entries for audit and reconciliation
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /noc/summary:
    get:
      summary: Get active incident, maintenance, and recent resolution totals for network operations
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /noc/incidents:
    get:
      summary: List NOC incidents and maintenance windows with customer and asset impact
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    post:
      summary: Create a NOC incident or maintenance record
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
  /noc/incidents/{id}:
    put:
      summary: Update a NOC incident, impact scope, or maintenance window
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ops-health/summary:
    get:
      summary: Get a tenant operations health score with module status, risk counts, and prioritized issues
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
  /service-ops/summary:
    get:
      summary: Get inventory and IPAM summary totals for service operations
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /service-ops/assets:
    get:
      summary: List inventory assets and their current customer linkage
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    post:
      summary: Create a new inventory asset
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
  /service-ops/assets/{id}:
    put:
      summary: Update an inventory asset
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /service-ops/assets/{id}/assign-customer:
    post:
      summary: Link an inventory asset to a customer account
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /service-ops/assets/{id}/unassign-customer:
    post:
      summary: Remove the current customer linkage from an inventory asset
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /service-ops/ip-pools:
    get:
      summary: List IP pools and current utilization metrics
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    post:
      summary: Create a new IP pool
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
  /service-ops/ip-pools/{id}:
    put:
      summary: Update an IP pool definition
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /service-ops/ip-pools/{id}/allocate:
    post:
      summary: Allocate or reserve an IP address from a pool
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201': { description: Created }
        '404': { description: Not found }
        '409': { description: Pool exhausted or requested IP unavailable }
  /service-ops/ip-assignments:
    get:
      summary: List IP assignments across customers, devices, and infrastructure
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /service-ops/ip-assignments/{id}/release:
    post:
      summary: Release an active IP assignment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /support/summary:
    get:
      summary: Get support ticket and work-order summary totals
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /support/tickets:
    get:
      summary: List support tickets with linked customers, assets, and work orders
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    post:
      summary: Create a support ticket with SLA timestamps and optional linkage
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
  /support/tickets/{id}:
    put:
      summary: Update a support ticket, add notes, or change ownership and status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /support/work-orders:
    get:
      summary: List work orders with linked customers, assets, and support tickets
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    post:
      summary: Create a field work order and optionally link it to a support ticket
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '403': { description: Forbidden }
  /support/work-orders/{id}:
    put:
      summary: Update a field work order and sync related support ticket state
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /sms/summary:
    get:
      summary: Summarize tenant outbound message delivery over a recent window
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200': { description: OK }
  /sms/deliveries:
    get:
      summary: List tenant message delivery ledger entries with status and template filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: templateType
          schema: { type: string }
        - in: query
          name: customerId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK }
  /sms/campaigns:
    get:
      summary: List outbound SMS campaigns with send, skip, and failure counts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: OK }
        '403': { description: Owner or admin role required }
    post:
      summary: Send a controlled outbound SMS campaign after audience preview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                templateType: { type: string }
                category: { type: string, example: service }
                language: { type: string, example: en }
                body: { type: string }
                message: { type: string }
                includePaylink: { type: boolean }
                dueAt: { type: string, format: date-time }
                audience:
                  type: object
                  properties:
                    status: { type: string }
                    connectionType: { type: string, enum: [pppoe, static] }
                    planId: { type: string }
