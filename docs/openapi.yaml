  /customers/{id}/privacy/anonymize:
    post:
      summary: Anonymize direct customer identifiers while retaining commercial records
      description: Clears customer PII, disables portal/contact paths, pseudonymizes the account number, scrubs linked message/support/work-order free text, and preserves finance/audit history.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: Exact confirmation phrase from the anonymization-plan endpoint.
                reason:
                  type: string
                  nullable: true
      responses:
        '200': { description: Customer anonymized }
        '400': { description: Confirmation phrase missing or invalid }
        '403': { description: Owner or admin role required }
        '404': { description: Customer not found }
        '409': { description: Customer already anonymized }
