name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/isp_billing_ci
      JWT_SECRET: ci-jwt-secret-with-enough-length
      MPESA_ENV: sandbox
      CLIENT_URL: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate environment contract
        run: npm run env:check
      - name: Check tracked source for credential patterns
        run: node scripts/check-secrets.js
      - name: Validate API contract coverage
        run: npm run api:contract:audit
      - name: Validate route security classification
        run: npm run security:routes:audit
      - name: Validate privacy policy controls
        run: npm run privacy:policy:audit
      - name: Syntax-check operational scripts
        run: |
          node --check server/App.js
          node --check server/scripts/run-migrations.js
          node --check server/scripts/audit-indexes.js
          node --check server/scripts/audit-api-contract.js
          node --check server/scripts/audit-route-security.js
          node --check server/scripts/audit-privacy-policy.js
          node --check server/scripts/run-privacy-retention.js
          node --check server/scripts/backup-mongo.js
          node --check server/scripts/restore-mongo.js
          node --check server/scripts/encrypt-configuration-secrets.js
          node --check server/scripts/reissue-tokens.js
      - name: Run server tests
        run: npm run test:server
      - name: Run database integration checks
        run: npm run test:integration
      - name: Validate backup dry-run
        run: npm run backup:mongo:plan -- --label ci
      - name: Install MongoDB tools for restore verification
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.19.0.tgz -o "$RUNNER_TEMP/mongo-tools.tgz"
          tar -xzf "$RUNNER_TEMP/mongo-tools.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-database-tools-ubuntu2404-x86_64-100.19.0/bin" >> "$GITHUB_PATH"
      - name: Verify backup and restore in isolated databases
        run: npm run test:restore

  client:
    name: Client Build
    runs-on: ubuntu-latest
    env:
      CI: true
      REACT_APP_API_URL: http://localhost:5000/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run client CI
        run: npm run ci:client
      - name: Dependency security gate
        run: npm run security:dependencies
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser journeys and accessibility
        run: npm run test:browser
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
