name: Render Deploy Hook

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Render Release Candidate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      MONGO_URI: mongodb://127.0.0.1:27017/isp_billing_ci
      JWT_SECRET: ci-jwt-secret-with-enough-length
      MPESA_ENV: sandbox
      CLIENT_URL: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      REACT_APP_API_URL: http://localhost:5000/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate Render blueprint exists
        run: |
          test -f render.yaml
          grep -q "isp-billing-api" render.yaml
          grep -q "isp-billing-client" render.yaml
      - name: Validate environment contract
        run: npm run env:check
      - name: Run server tests
        run: npm run test:server
      - name: Build client
        run: npm run build

  deploy:
    name: Trigger Render Deploy Hook
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && vars.RENDER_DEPLOY_ENABLED == 'true'
    steps:
      - name: Trigger deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
